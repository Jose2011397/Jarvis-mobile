<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - Painel Mobile & Nuvem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700 text-center">
        <h1 class="text-3xl font-bold text-cyan-400 mb-2">Jarvis AI</h1>
        <p class="text-slate-400 text-sm mb-6">Painel de Controlo Mobile & Nuvem</p>

        <!-- Status -->
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 mb-4">
            <span class="inline-block w-3 h-3 rounded-full bg-red-500 mr-2" id="dot-status"></span>
            <span id="texto-status" class="text-sm font-medium text-slate-300">Aguardando comando...</span>
        </div>

        <!-- Botão Rotina Bom Dia -->
        <div class="mb-4">
            <button onclick="acionarBomDia()" class="w-full bg-amber-600 hover:bg-amber-700 font-semibold py-2.5 px-4 rounded-xl transition text-sm shadow-lg shadow-amber-600/20">
                ☀️ Jarvis Bom Dia (Clima)
            </button>
        </div>

        <!-- Botão Ligar PC (Wake-on-LAN via Nuvem) -->
        <div class="mb-4">
            <button onclick="enviarComandoNuvem('ligar')" class="w-full bg-emerald-600 hover:bg-emerald-700 font-semibold py-3 px-4 rounded-xl transition text-sm shadow-lg shadow-emerald-600/20">
                🟢 Ligar PC (Wake-on-LAN)
            </button>
        </div>

        <!-- Seletor Dinâmico de Aplicativos do PC -->
        <div class="mb-4 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 text-left">
            <label class="block text-xs text-slate-400 mb-2">Selecione um aplicativo para abrir:</label>
            <div class="flex gap-2">
                <select id="select-apps" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-cyan-500">
                    <option value="">Carregando apps...</option>
                </select>
                <button onclick="abrirAppSelecionado()" class="bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold px-4 rounded-lg transition text-sm">
                    Abrir
                </button>
            </div>
        </div>

        <!-- Botão Desligar -->
        <div class="mb-4">
            <button onclick="enviarComandoPC('desligar')" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-2.5 px-4 rounded-xl transition text-sm">
                🔴 Desligar PC
            </button>
        </div>

        <!-- Comando de Voz -->
        <button onclick="iniciarEscutaVoz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-indigo-600/20">
            🎤 Iniciar Escuta por Voz
        </button>
    </div>

    <script>
        // Carrega a URL da nuvem diretamente do config.js
        const CLOUD_URL = window.CONFIG.CLOUD_URL;

        function falarTexto(texto) {
            if ('speechSynthesis' in window) {
                const uttr = new SpeechSynthesisUtterance(texto);
                uttr.lang = 'pt-BR';
                window.speechSynthesis.speak(uttr);
            }
        }

        async function carregarAppsDisponiveis() {
            try {
                const response = await fetch(`${CLOUD_URL}/pc/apps`);
                const apps = await response.json();
                const select = document.getElementById('select-apps');
                select.innerHTML = "";
                
                apps.forEach(appItem => {
                    let opt = document.createElement('option');
                    opt.value = appItem.comando;
                    opt.innerText = appItem.nome;
                    select.appendChild(opt);
                });
                document.getElementById('dot-status').className = "inline-block w-3 h-3 rounded-full bg-green-500 mr-2";
                document.getElementById('texto-status').innerText = "Conectado à nuvem com sucesso!";
            } catch (err) {
                console.error("Erro ao carregar apps:", err);
                document.getElementById('dot-status').className = "inline-block w-3 h-3 rounded-full bg-red-500 mr-2";
                document.getElementById('select-apps').innerHTML = '<option value="">Erro ao conectar com a nuvem</option>';
                document.getElementById('texto-status').innerText = "Erro ao conectar com a nuvem (Servidor hibernando?).";
            }
        }

        async function acionarBomDia() {
            document.getElementById('texto-status').innerText = "Obtendo previsão do tempo...";
            try {
                const response = await fetch(`${CLOUD_URL}/api/bom-dia`);
                const data = await response.json();
                document.getElementById('texto-status').innerText = data.mensagem;
                falarTexto(data.mensagem);
            } catch (err) {
                document.getElementById('texto-status').innerText = "Erro ao conectar com a nuvem.";
            }
        }

        async function enviarComandoNuvem(acao) {
            document.getElementById('texto-status').innerText = `Enviando comando ${acao}...`;
            try {
                const response = await fetch(`${CLOUD_URL}/pc/${acao}`, { method: 'POST' });
                const data = await response.json();
                document.getElementById('texto-status').innerText = data.mensagem;
            } catch (err) {
                document.getElementById('texto-status').innerText = "Erro ao conectar com a nuvem.";
            }
        }

        async function enviarComandoPC(acao, appNome = "") {
            document.getElementById('texto-status').innerText = `Enviando comando para a fila...`;
            try {
                const response = await fetch(`${CLOUD_URL}/pc/comando`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ acao: acao, parametro: appNome })
                });
                const data = await response.json();
                document.getElementById('texto-status').innerText = data.mensagem;
            } catch (err) {
                document.getElementById('texto-status').innerText = "Erro ao enviar comando.";
            }
        }

        function abrirAppSelecionado() {
            const select = document.getElementById('select-apps');
            const appComando = select.value;
            if (appComando) {
                enviarComandoPC('abrir', appComando);
            }
        }

        function iniciarEscutaVoz() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Seu navegador não suporta reconhecimento de voz.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            
            document.getElementById('dot-status').className = "inline-block w-3 h-3 rounded-full bg-yellow-500 mr-2 animate-pulse";
            document.getElementById('texto-status').innerText = "Ouvindo... Fale agora.";

            recognition.onresult = function(event) {
                const transcricao = event.results[0][0].transcript.toLowerCase();
                document.getElementById('dot-status').className = "inline-block w-3 h-3 rounded-full bg-green-500 mr-2";
                
                if (transcricao.includes("bom dia")) {
                    acionarBomDia();
                } else if (transcricao.includes("ligar")) {
                    enviarComandoNuvem('ligar');
                } else {
                    document.getElementById('texto-status').innerText = `Comando de voz: "${transcricao}"`;
                }
            };

            recognition.start();
        }

        // Executa a verificação inicial de conexão e preenchimento dos apps
        carregarAppsDisponiveis();
    </script>
</body>
</html>
